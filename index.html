<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="img/7.menu/under-water-background.jpg">
    <link rel="icon" href="img/1.Sharkie/1.IDLE/1.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css">
    <script src="./classes/keyboard.class.js"></script>
    <script src="game.js"></script>
    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/moveable-objects.class.js"></script>
    <script src="./classes/endboss-healthbar.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/puffer-fish.js"></script>
    <script src="./classes/jelly-fish.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/throwable.class.js"></script>
    <script src="./classes/collectable.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./levels/level1.js"></script>

</head>

<body onload="init()">
    <h1 id="gameHeadline">Sharkie</h1>
    <h2 id="startHeadline"></h2>
    <p id="excuseText" style="display: none;"></p>
    <div id="headerWrapper">
        <button id="menuMuteBtn" onclick="toggleMuteFromMenu()">🔊</button>
    </div>
    <img onclick="startGame()" src="img/6.Botones/Start/1.png" alt="Start" id="startBtn">
    <div id="descriptionBtn" class="endScreenBtn" onclick="openDescription()">What is Sharkie?</div>
    <div class="endScreenBtn" id="backToMenu" onclick="backToMenu()" style="display: none;">Back to Menu</div>
    <canvas width="1020" height="480" id="canvas" style="display: none;"></canvas>
    <div id="endScreen" style="display: none;">
        <img class="endScreenImg" id="endScreenImg" src="img/6.Botones/Tittles/Game Over/Recurso 9.png" alt="">
        <div id="endScreenBtns" class="endScreenBtns" style="display: none;">
            <div class="endScreenBtn" onclick="backToMenu()">Back to Menu</div>
            <div class="endScreenBtn" id="changingBtn" onclick=""></div>
        </div>
    </div>
    <div id="description" style="display: none;">
        <p id="startText"></p>
        <div id="infoTable"></div>
        <div id="closeDescriptionBtn" class="endScreenBtn" onclick="closeDescription()">Close Description</div>
    </div>
    <div id="touch-controls" style="display: none;">
        <div class="touch-controls-left">
            <button class="movingBtn" id="leftBtn">◀</button>
            <button class="movingBtn" id="rightBtn">▶</button>
            <button class="movingBtn" id="upBtn">▲</button>
            <button class="movingBtn" id="downBtn">▼</button>
        </div class="touch-controls-right">
        <div>
            <button class="movingBtn" id="shootBtn">ATTACK</button>
        </div>
    </div>
    <button id="impressumBtn" onclick="loadImpressum()">Impressum</button>
    <div id="impressum" style="display: none;"></div>
</body>

</html>
